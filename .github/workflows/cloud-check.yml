name: Cloud Account Branch Check

on:
  push:
    branches:
      - feature/cloud-accounts
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: npm ci

      - name: Check server syntax
        run: |
          node --check server/server.mjs
          node --check server/cloud-routes.mjs

      - name: Check browser module syntax
        run: |
          node --check js/cloud-bootstrap.js
          node --check js/auth.js
          node --check js/auth-guard.js
          node --check js/bulk-materials.js

      - name: End-to-end cloud proxy smoke test
        shell: bash
        run: |
          set -euo pipefail

          export PORT=3000
          npm start > /tmp/campusflow.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            sleep 1
          done

          USERNAME="ci_cloud_proxy_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          PASSWORD="CampusFlow-CI-2026!"

          SIGNUP=$(
            curl -fsS               -c /tmp/cookies.txt               -H "Content-Type: application/json"               -d "{\"username\":\"$USERNAME\",\"password\":\"$PASSWORD\",\"role\":\"student\"}"               http://127.0.0.1:3000/api/auth/signup
          )

          echo "$SIGNUP" | grep -q '"status":"ok"'

          ME=$(
            curl -fsS               -b /tmp/cookies.txt               http://127.0.0.1:3000/api/auth/me
          )

          echo "$ME" | grep -q "\"username\":\"$USERNAME\""

          SAVE=$(
            curl -fsS               -b /tmp/cookies.txt               -X PUT               -H "Content-Type: application/json"               -d '{"data":{"campusflow-ci":"proxy-snapshot-ok"}}'               http://127.0.0.1:3000/api/cloud/snapshot
          )

          echo "$SAVE" | grep -q '"status":"ok"'

          LOAD=$(
            curl -fsS               -b /tmp/cookies.txt               http://127.0.0.1:3000/api/cloud/snapshot
          )

          echo "$LOAD" | grep -q '"campusflow-ci":"proxy-snapshot-ok"'

          UPLOAD=$(
            curl -fsS               -b /tmp/cookies.txt               -H "Content-Type: application/json"               -d '{"courseId":"CI-TEST","fileName":"test.txt","mimeType":"text/plain","fileSize":4}'               http://127.0.0.1:3000/api/cloud/files/upload-url
          )

          echo "$UPLOAD" | grep -q '"signedUrl":'
          echo "$UPLOAD" | grep -q '"token":'

          LOGOUT=$(
            curl -fsS               -b /tmp/cookies.txt               -X POST               http://127.0.0.1:3000/api/auth/logout
          )

          echo "$LOGOUT" | grep -q '"status":"ok"'
