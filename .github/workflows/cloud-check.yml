name: Cloud Account Branch Check

on:
  push:
    branches:
      - feature/cloud-accounts
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Check server syntax
        run: |
          node --check server/server.mjs
          node --check server/cloud-database.mjs
          node --check server/cloud-routes.mjs

      - name: Check browser module syntax
        run: |
          node --check js/cloud-bootstrap.js
          node --check js/auth.js
          node --check js/auth-guard.js
          node --check js/bulk-materials.js
